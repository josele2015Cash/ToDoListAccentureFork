@if (message) {
  <div class="row"> 
    <div class="col-1 align-self-center">  
      <ion-checkbox [formControl]="check" (click)="clickCheck()"></ion-checkbox>
    </div>
    <div class="col-11 align-self-center">  
      <ion-item
        [routerLink]="'/message/' + message.id"
        [detail]="false"
        >
        <div slot="start" [class]="!message.check ? 'dot dot-unread' : 'dot'"></div>
        <ion-label class="ion-text-wrap">
          <h2>
            {{ message.fromName }}
            <span class="date">
              <ion-note>{{ message.date }}</ion-note>
              @if (isIos()) {
                <ion-icon
                  aria-hidden="true"
                  name="chevron-forward"
                  size="small"
                ></ion-icon>
              }
            </span>
          </h2>
          <h3>{{ message.subject }}</h3>
        </ion-label>
      </ion-item>
    </div>
  </div>
}
