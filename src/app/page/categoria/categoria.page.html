
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>Listas de categor&iacute;as</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">Inbox</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-list>
      @for (message of getMessages(); track message) {
      <app-message [message]="message"></app-message>
      }
    </ion-list>

    <div class="button-container">
      <ion-button>Crear Categoria</ion-button>
      <ion-button color="medium">Modificar Categoria</ion-button>
      <ion-button color="danger">Eliminar Categoria</ion-button>
    </div>
  </ion-content>
</div>
