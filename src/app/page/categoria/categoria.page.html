
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-searchbar placeholder="Buscar categorías..."></ion-searchbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>Listas de categor&iacute;as</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">Inbox</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-list>
      @for (message of getMessages(); track message) {
      <app-message (checkChange)="manejarAccion($event)" [message]="message"></app-message>
      }
    </ion-list>

    <div class="button-container">
      <ion-button expand="block" (click)="clickCrearCategoria()">Crear Categoria</ion-button>
      <ion-button expand="block" color="medium" (click)="clickModificarCategoria()">Modificar Categoria</ion-button>
      <ion-button expand="block" color="danger" (click)="clickEliminarCategoria()">Eliminar Categoria</ion-button>
    </div>
  </ion-content>
</div>
