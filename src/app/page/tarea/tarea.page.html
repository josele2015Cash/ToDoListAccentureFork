
<div class="ion-page" id="main-content">
  <ion-header>
    
    <ion-toolbar>
    <ion-searchbar placeholder="buscar tareas..."></ion-searchbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>    
    </ion-toolbar>
  </ion-header>

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>Lista de tareas</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">Inbox</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-list>
      @for (message of getMessages(); track message) {
      <app-message-tarea (checkChange)="manejarAccion($event)" [message]="message"></app-message-tarea>
      }
    </ion-list>

    <!-- Ejemplo 6: Grid responsivo personalizado -->
    <div class="button-grid">
      <div class="button-item">
        <ion-button expand="block" (click)="clickCrearTarea()">
          Crear Tarea</ion-button>
      </div>
      <div class="button-item">
        <ion-button expand="block" color="medium" (click)="clickModificarTarea()">
          Modificar Tarea</ion-button>
      </div>
      <div class="button-item">
        <ion-button expand="block" color="danger" (click)="clickEliminarTarea()">
          Eliminar Tarea</ion-button>
      </div>
    </div>
  </ion-content>
</div>
